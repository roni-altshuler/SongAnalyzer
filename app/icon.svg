<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark base square matching --bg-elev2 -->
  <rect width="64" height="64" rx="14" fill="#17171E"/>
  <!-- Accent stripe gradient mirroring the mood-color cascade -->
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- Five vertical bars of varying height — equalizer silhouette readable at 16px -->
  <g fill="#F5F5F7">
    <rect x="14" y="26"  width="5" height="12" rx="2.5"/>
    <rect x="22" y="20"  width="5" height="24" rx="2.5"/>
    <rect x="38" y="22"  width="5" height="20" rx="2.5"/>
    <rect x="46" y="28"  width="5" height="8"  rx="2.5"/>
  </g>
  <!-- Accent bar drawn on top so it 'sings' even at favicon scale -->
  <rect x="30" y="14" width="5" height="36" rx="2.5" fill="url(#a)"/>
</svg>
