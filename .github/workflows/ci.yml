name: CI

on:
  push:
    branches: [main, v2-overhaul]
  pull_request:
    branches: [main]

# Cancel in-flight runs when a new commit lands on the same ref. Saves minutes
# on PRs that get force-pushed frequently.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          # Vite 7 needs >=20.19; we pin to a known-good 20.x to avoid drift.
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript (noEmit)
        run: npx tsc --noEmit

      - name: Vitest
        # RLS suite is skipped automatically — it self-gates on SUPABASE_LOCAL=1
        # which we don't set in CI (no local Postgres in this job).
        run: npm test

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-typecheck-test
    # Only run E2E on PRs and pushes to main / v2-overhaul. Skipping forks keeps
    # the matrix lean — they re-trigger when merged.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # Only Chromium for the smoke run — keeps the install fast.
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke suite
        # The Playwright config boots `next dev` via webServer, so no env vars
        # are required. The suite exercises the keyword fallback + design system.
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
